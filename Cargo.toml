[workspace]
resolver = "2"
members = ["crates/oag-primitives", "crates/oag-consensus", "crates/oag-pow", "crates/oag-chain", "crates/oag-store", "crates/oag-mempool", "crates/oag-net", "crates/oag-miner", "crates/oag-rpc", "crates/oag-node", "crates/oag-wallet", "crates/oag-wallet-wasm"]

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/manh923/Orange"
authors = ["Orange contributors"]

[workspace.dependencies]
oag-primitives = { path = "crates/oag-primitives", version = "0.5.1" }
oag-consensus = { path = "crates/oag-consensus", version = "0.5.1" }
oag-pow = { path = "crates/oag-pow", version = "0.5.1" }
oag-chain = { path = "crates/oag-chain", version = "0.5.1" }
oag-mempool = { path = "crates/oag-mempool", version = "0.5.1" }
oag-miner = { path = "crates/oag-miner", version = "0.5.1" }
oag-net = { path = "crates/oag-net", version = "0.5.1" }
oag-store = { path = "crates/oag-store", version = "0.5.1" }
oag-rpc = { path = "crates/oag-rpc", version = "0.5.1" }
oag-node = { path = "crates/oag-node", version = "0.5.1" }
oag-wallet = { path = "crates/oag-wallet", version = "0.5.1", default-features = false }
oag-wallet-wasm = { path = "crates/oag-wallet-wasm", version = "0.5.1" }
bech32 = "0.12"
clap = { version = "4", features = ["derive"] }
blake3 = "1"
hex = "0.4"
secp256k1 = "0.33"
redb = "4"
argon2 = "0.5"
chacha20poly1305 = "0.11"
# TLS は ring を使う。既定の aws-lc-rs は cmake と C コンパイラを要求し、
# RandomX を既定で外してあるのと同じ理由で、組み立ての敷居を上げたくない。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rpassword = "7"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
zeroize = { version = "1", features = ["alloc", "zeroize_derive"] }
tokio = "1"
thiserror = "2"

[profile.release]
# 静かに誤った金額を生成するより異常終了する方が被害が小さい (docs/SPEC.md §3)
overflow-checks = true
debug-assertions = false
lto = "thin"
codegen-units = 1
